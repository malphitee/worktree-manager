[package]
name = "worktree-manager"
version = "0.1.0"
description = "Worktree Manager · 多仓库 worktree 工作区管理工具"
authors = []
edition = "2021"
rust-version = "1.77.2"

[lib]
# 同时产出静态库 / 动态库 / rlib，桌面端只用到 rlib 与 cdylib（Tauri 约定）
name = "worktree_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["clock", "serde"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
